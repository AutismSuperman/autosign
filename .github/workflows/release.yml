name: Release

# 只在「里程碑」——即打正式版本 tag 时构建并发布。
# 预发布 tag（含 -beta / -rc）走下面的分支，产物标记为 prerelease，
# 不会成为 electron-updater 的默认更新源。
on:
  push:
    tags:
      - 'v*'
  # 手动触发：用于验证 CI 配置本身，不会发布 release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 敏感信息扫描
        run: node scripts/check-secrets.mjs --all

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test 2>&1 | tee test-output.log

      - name: 测试失败时保留输出
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output
          path: test-output.log

      - name: 构建
        run: npm run build

      # Electron 在无显示服务器的 Linux 上需要 xvfb，
      # 且 libgtk-3 等运行库不在 runner 的默认镜像里，必须显式安装，
      # 否则进程起不来、验证会以「渲染进程未启动」失败。
      - name: 安装 Electron 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth \
            libgtk-3-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgbm1 libasound2t64 libxcomposite1 libxdamage1 \
            libxfixes3 libxkbcommon0 libxrandr2 libxshmfence1 \
            libpango-1.0-0 libcairo2 libatspi2.0-0

      - name: 确保 Electron 二进制已下载
        run: node node_modules/electron/install.js

      - name: 界面验证
        run: xvfb-run --auto-servernum npm run verify:ui 2>&1 | tee verify-output.log

      - name: 界面验证失败时保留输出
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: verify-output
          path: verify-output.log

  build:
    name: 打包 ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron-builder 从 tag 推导版本号，避免与 package.json 不一致
      - name: 校验版本号与 tag 一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json 的 $pkg 不一致" >&2
            exit 1
          fi

      - name: 打包并发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          npm run build
          # 三个平台的 job 并发跑，同时 --publish always 会互相覆盖 release，
          # 导致最终没有资产。这里只构建，统一由下面的发布 job 收集上传。
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macOS 同时出 Apple Silicon 与 Intel 两版
            npx electron-builder --config electron-builder.config.cjs --publish never \
              --mac --arm64 --x64
          else
            npx electron-builder --config electron-builder.config.cjs --publish never
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          # latest.yml / *.blockmap 也要带上：自动更新依赖它们判断版本
          # macOS 的 zip 是 electron-updater 唯一接受的更新包格式，缺了它
          # 客户端会报「ZIP file not provided」，所以必须一起上传。
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    name: 发布到 Release
    needs: build
    runs-on: ubuntu-latest
    # 创建 Release 与上传资产需要写权限；顶层已声明，这里再显式标注一层
    permissions:
      contents: write
    steps:
      # 必须 checkout：发布说明写在 docs/releases/v<version>.md 里，
      # 不取代码就只能拿到一个空目录，最终静默退回固定文案
      # （v0.4.0 / v0.4.1 就是这么丢掉变更内容的）。
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: 整理产物到一个目录
        run: |
          mkdir -p release
          find artifacts -type f -maxdepth 2 -exec cp -v {} release/ \;
          echo '--- release/ ---'
          ls -la release

      # 用社区维护的 action 而不是手写 gh 命令：它把 release 的创建/更新、
      # 资产上传与重跑幂等性都处理好了，也支持 prerelease 判断。
      - name: 读取发布说明
        id: notes
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag="${TAG_NAME#v}"
          file="docs/releases/v${tag}.md"
          # 缺发布说明直接失败，而不是发一个「不知道更新了什么」的版本。
          # AGENTS.md §1.7 要求每个版本都有可读的变更说明。
          if [ ! -f "$file" ]; then
            echo "::error::缺少 $file —— 发布说明必须随版本提交"
            exit 1
          fi
          echo "使用 $file 作为发布说明"
          {
            cat "$file"
            printf '\n---\n\n## 安装包\n\n'
            printf -- '- Windows：`*-win.exe`（NSIS 安装包，支持应用内自动更新）\n'
            printf -- '- macOS：`*-mac.dmg`（覆盖安装即可；`*-mac.zip` 供应用内更新使用）\n'
            printf -- '- Linux：`*-linux.AppImage`\n'
          } > release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: AutoSign ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: release/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
