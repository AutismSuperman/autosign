name: Release

# 只在「里程碑」——即打正式版本 tag 时构建并发布。
# 预发布 tag（含 -beta / -rc）走下面的分支，产物标记为 prerelease，
# 不会成为 electron-updater 的默认更新源。
on:
  push:
    tags:
      - 'v*'
  # 手动触发：用于验证 CI 配置本身，不会发布 release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 敏感信息扫描
        run: node scripts/check-secrets.mjs --all

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test 2>&1 | tee test-output.log

      - name: 测试失败时保留输出
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log

      - name: 构建
        run: npm run build

      # Electron 在无显示服务器的 Linux 上需要 xvfb，
      # 且 libgtk-3 等运行库不在 runner 的默认镜像里，必须显式安装，
      # 否则进程起不来、验证会以「渲染进程未启动」失败。
      - name: 安装 Electron 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth \
            libgtk-3-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgbm1 libasound2t64 libxcomposite1 libxdamage1 \
            libxfixes3 libxkbcommon0 libxrandr2 libxshmfence1 \
            libpango-1.0-0 libcairo2 libatspi2.0-0

      - name: 确保 Electron 二进制已下载
        run: node node_modules/electron/install.js

      - name: 界面验证
        run: xvfb-run --auto-servernum npm run verify:ui 2>&1 | tee verify-output.log

      - name: 界面验证失败时保留输出
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: verify-output.log

  build:
    name: 打包 ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron-builder 从 tag 推导版本号，避免与 package.json 不一致
      - name: 校验版本号与 tag 一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json 的 $pkg 不一致" >&2
            exit 1
          fi

      - name: 打包并发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --config electron-builder.config.cjs --publish always
